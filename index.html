<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belajar Nahwu Bersama AHMAD ZAKIN JAISYURROYA</title>
  
  <!-- Font Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Philosopher:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-pure: #d4af37;
      --gold-glow: #f9e295;
      --gold-dark: #8c6d23;
      --bg-dark: #051812;
      --card-bg: linear-gradient(180deg, rgba(13, 56, 41, 0.95) 0%, rgba(5, 24, 17, 0.98) 100%);
      --emerald-border: #1a533f;
      --cream-light: #f7f1e3;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #0d3829 0%, #061811 65%, #020906 100%);
      font-family: 'Poppins', sans-serif;
      color: var(--cream-light);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Bingkai Utama Funnel */
    .funnel-card {
      position: relative;
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 2px solid var(--gold-pure);
      border-radius: 28px;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.25), 0 15px 40px rgba(0, 0, 0, 0.8);
      padding: 35px 26px;
      backdrop-filter: blur(8px);
    }

    /* Ornamen Sudut */
    .corner-ornament {
      position: absolute;
      width: 22px;
      height: 22px;
      border: 2px solid var(--gold-glow);
      opacity: 0.8;
      pointer-events: none;
    }
    .corner-ornament.top-left { top: 12px; left: 12px; border-right: none; border-bottom: none; }
    .corner-ornament.top-right { top: 12px; right: 12px; border-left: none; border-bottom: none; }
    .corner-ornament.bottom-left { bottom: 12px; left: 12px; border-right: none; border-top: none; }
    .corner-ornament.bottom-right { bottom: 12px; right: 12px; border-left: none; border-top: none; }

    /* Navigasi & Bar Progres */
    .funnel-header {
      margin-bottom: 22px;
    }

    .nav-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .btn-back {
      background: transparent;
      border: none;
      color: var(--gold-glow);
      font-size: 0.85rem;
      cursor: pointer;
      visibility: hidden;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn-back:hover {
      color: #fff;
      transform: translateX(-3px);
    }

    .step-indicator {
      font-size: 0.8rem;
      color: var(--gold-glow);
      font-weight: 600;
    }

    .progress-track {
      background: rgba(0, 0, 0, 0.5);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .progress-bar {
      background: linear-gradient(90deg, #d4af37, #f9e295);
      height: 100%;
      width: 25%;
      transition: width 0.3s ease;
    }

    /* Header Pertanyaan */
    .question-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .bismillah-mini {
      font-family: 'Amiri', serif;
      font-size: 1.15rem;
      color: var(--gold-glow);
      display: block;
      margin-bottom: 4px;
    }

    .question-title {
      font-family: 'Philosopher', serif;
      font-size: 1.45rem;
      color: #fff;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .question-sub {
      font-size: 0.85rem;
      color: #c8d6e5;
      line-height: 1.5;
    }

    /* Kartu Pilihan Jawaban */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.45);
      border: 1.5px solid var(--emerald-border);
      border-radius: 14px;
      padding: 16px 18px;
      cursor: pointer;
      transition: all 0.22s ease;
      user-select: none;
    }

    .option-card:hover {
      background: rgba(212, 175, 55, 0.18);
      border-color: var(--gold-pure);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(212, 175, 55, 0.25);
    }

    .option-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .option-icon {
      font-size: 1.6rem;
      background: rgba(212, 175, 55, 0.15);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--gold-dark);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-text h4 {
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 3px;
    }

    .option-text p {
      font-size: 0.78rem;
      color: #a4b0be;
      line-height: 1.3;
    }

    .option-arrow {
      color: var(--gold-pure);
      font-size: 1.2rem;
      font-weight: bold;
      margin-left: 8px;
    }

    /* Formulir Input Nama */
    .input-name-group {
      margin-top: 10px;
      text-align: left;
    }

    .input-name-group label {
      font-size: 0.85rem;
      color: var(--gold-glow);
      display: block;
      margin-bottom: 6px;
    }

    .input-name-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.5);
      border: 1.5px solid var(--gold-dark);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .input-name-group input:focus {
      border-color: var(--gold-pure);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }

    .btn-submit-name {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      background: linear-gradient(135deg, #d4af37, #b8860b);
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      color: #061712;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-submit-name:hover {
      background: #f9e295;
      box-shadow: 0 0 15px rgba(249, 226, 149, 0.6);
    }
  </style>
</head>
<body>

  <main class="funnel-card">
    <div class="corner-ornament top-left"></div>
    <div class="corner-ornament top-right"></div>

    <div class="funnel-header">
      <div class="nav-top">
        <button id="btnBack" class="btn-back" type="button" onclick="prevStep()">← Kembali</button>
        <span class="step-indicator" id="stepIndicator">Langkah 1 / 4</span>
      </div>
      <div class="progress-track">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>

    <div id="quizArea">
      <div class="question-header">
        <span class="bismillah-mini">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
        <h2 id="questionTitle" class="question-title">Pilih Fokus Pembelajaran Anda</h2>
        <p id="questionSub" class="question-sub">Setiap modul dirancang interaktif untuk memudahkan pemahaman kaidah bahasa Arab.</p>
      </div>

      <div id="optionsContainer" class="options-container"></div>
    </div>

    <div class="corner-ornament bottom-left"></div>
    <div class="corner-ornament bottom-right"></div>
  </main>

  <script>
    const steps = [
      {
        title: "Pilih Fokus Pembelajaran Anda",
        subtitle: "Pilih materi utama yang ingin Anda pelajari bersama AHMAD ZAKIN JAISYURROYA:",
        type: "options",
        options: [
          {
            icon: "🎵",
            title: "Himpunan Lagu Nahwiyah",
            desc: "Hafalan mudah tanda Isim, Haraf & Wazan dengan irama lagu yang mengasyikkan",
            targetTab: "lvl1"
          },
          {
            icon: "📖",
            title: "Latihan Teks Arab Tanpa Syakal",
            desc: "Praktik membaca pola bangunan kalimah fi'il & isim musytaq (Arab Gundul)",
            targetTab: "latihan"
          },
          {
            icon: "📜",
            title: "Nazham Jurumiyah Bahasa Indonesia",
            desc: "Bait-bait nadhom terjemah puitis memudahkan natsar Ibnu Ajurrumi",
            targetTab: "nazham"
          }
        ]
      },
      {
        title: "Tingkat Kemampuan Bahasa Arab",
        subtitle: "Bantu kami menyesuaikan tingkat bimbingan belajar Anda:",
        type: "options",
        options: [
          {
            icon: "🌱",
            title: "Tingkat Pemula (Mubtadi')",
            desc: "Baru mengenal jenis kata isim, fi'il, dan haraf",
            targetTab: null
          },
          {
            icon: "🌿",
            title: "Tingkat Menengah (Mutawassith)",
            desc: "Sudah hafal wazan tsulatsi dan ingin melancarkan tashrif",
            targetTab: null
          },
          {
            icon: "🌳",
            title: "Tingkat Lanjutan (Mutaqaddim)",
            desc: "Fokus mendalami i'rab kalimat dan membaca kitab kuning",
            targetTab: null
          }
        ]
      },
      {
        title: "Target Waktu Muraja'ah Harian",
        subtitle: "Konsistensi adalah kunci keberkahan ilmu:",
        type: "options",
        options: [
          {
            icon: "⏳",
            title: "10 - 15 Menit / Hari",
            desc: "Santai, menghafal 1 bait lagu nahwiyah per hari",
            targetTab: null
          },
          {
            icon: "⚡",
            title: "20 - 30 Menit / Hari",
            desc: "Fokus membaca pola wazan dan latihan teks gundul",
            targetTab: null
          },
          {
            icon: "🔥",
            title: "Lebih dari 30 Menit / Hari",
            desc: "Intensif mengkaji bait nazham dan latihan i'rab",
            targetTab: null
          }
        ]
      },
      {
        title: "Biodata Santri Pembelajar",
        subtitle: "Silakan masukkan nama Anda untuk membuka modul materi:",
        type: "input_name"
      }
    ];

    let currentStep = 0;
    let targetPilihan = "lvl1";

    function renderStep() {
      const step = steps[currentStep];
      const total = steps.length;
      const progressPercent = ((currentStep + 1) / total) * 100;

      document.getElementById('progressBar').style.width = progressPercent + '%';
      document.getElementById('stepIndicator').innerText = `Langkah ${currentStep + 1} / ${total}`;
      document.getElementById('btnBack').style.visibility = currentStep > 0 ? "visible" : "hidden";
      document.getElementById('questionTitle').innerText = step.title;
      document.getElementById('questionSub').innerText = step.subtitle;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = "";

      if (step.type === "options") {
        step.options.forEach(opt => {
          const card = document.createElement('div');
          card.className = "option-card";
          card.innerHTML = `
            <div class="option-left">
              <div class="option-icon">${opt.icon}</div>
              <div class="option-text">
                <h4>${opt.title}</h4>
                <p>${opt.desc}</p>
              </div>
            </div>
            <div class="option-arrow">→</div>
          `;
          card.onclick = function() {
            if (opt.targetTab) targetPilihan = opt.targetTab;
            currentStep++;
            renderStep();
          };
          container.appendChild(card);
        });
      } else if (step.type === "input_name") {
        container.innerHTML = `
          <form onsubmit="handleFinalSubmit(event)">
            <div class="input-name-group">
              <label for="inputNama">Nama Lengkap Santri</label>
              <input type="text" id="inputNama" placeholder="Tuliskan nama Anda..." required autofocus>
            </div>
            <button type="submit" class="btn-submit-name">Mulai Belajar Sekarang ✨</button>
          </form>
        `;
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        renderStep();
      }
    }

    function handleFinalSubmit(event) {
      event.preventDefault();
      const nama = document.getElementById('inputNama').value.trim();
      if (nama !== "") {
        localStorage.setItem('namaSantri', nama);
        localStorage.setItem('targetTabAwal', targetPilihan);

        document.getElementById('quizArea').innerHTML = `
          <div class="question-header" style="padding: 20px 0;">
            <span class="bismillah-mini">بَارَكَ اللَّهُ فِيْكُمْ</span>
            <h2 class="question-title" style="color:var(--gold-glow); margin-top:10px;">Ahlan wa Sahlan, ${nama}!</h2>
            <p class="question-sub" style="font-size:0.95rem; margin-top:8px;">Modul pembelajaran interaktif Anda sedang disiapkan...</p>
          </div>
        `;

        setTimeout(() => {
          window.location.href = "materi.html";
        }, 1200);
      }
    }

    // Jalankan langsung
    renderStep();
  </script>
</body>
</html>
