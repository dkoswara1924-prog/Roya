<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Lagu Nahwu & Latihan Baca - AHMAD ZAKIN JAISYURROYA</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@700&family=Philosopher:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 10%, #0d2e23 0%, #061611 65%, #020806 100%);
      --gold-pure: #d4af37;
      --gold-glow: #f9e295;
      --gold-dark: #8c6d23;
      --card-bg: rgba(9, 38, 28, 0.94);
      --card-border: #b89128;
      --cream-light: #f7f1e3;
      --green-accent: #2ecc71;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Poppins', sans-serif;
      color: var(--cream-light);
      padding-bottom: 70px;
    }

    /* Navbar */
    .navbar {
      background: rgba(4, 18, 13, 0.95);
      border-bottom: 2px solid var(--gold-dark);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back-link { color: var(--gold-glow); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .nav-title { font-family: 'Amiri', serif; font-size: 1.5rem; color: var(--gold-pure); }
    .user-badge { font-size: 0.85rem; background: rgba(212, 175, 55, 0.15); padding: 5px 14px; border-radius: 20px; border: 1px solid var(--gold-dark); color: var(--gold-glow); }

    /* Hero Section */
    .hero-section { text-align: center; padding: 30px 20px 10px; }
    .hero-frame {
      max-width: 840px;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(11, 48, 35, 0.85) 0%, rgba(5, 24, 17, 0.95) 100%);
      border: 2px solid var(--gold-pure);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
    }
    .bismillah { font-family: 'Amiri', serif; font-size: 1.25rem; color: var(--gold-glow); }
    .hero-farisi { font-family: 'Noto Nastaliq Urdu', serif; font-size: 3rem; color: var(--gold-pure); line-height: 1.6; margin: 4px 0; }
    .hero-sub { font-size: 1.05rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .hero-dedication { font-size: 0.82rem; color: var(--gold-glow); margin-top: 6px; }

    /* 3 TAB UTAMA */
    .tab-wrapper-main {
      display: flex;
      justify-content: center;
      gap: 12px;
      max-width: 1000px;
      margin: 24px auto 15px;
      padding: 0 15px;
      flex-wrap: wrap;
    }
    .main-tab-btn {
      background: rgba(8, 30, 22, 0.85);
      border: 2px solid var(--gold-dark);
      color: #fff;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 260px;
    }
    .main-tab-btn span.sub { font-size: 0.72rem; font-weight: 400; color: #a4b0be; }
    .main-tab-btn:hover, .main-tab-btn.active {
      background: var(--gold-pure);
      color: #051610;
      border-color: #fff;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
      transform: translateY(-2px);
    }
    .main-tab-btn.active span.sub { color: #1e272e; font-weight: 500; }

    /* Sub-Filter Tab Wrapper */
    .sub-filter-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .sub-filter-btn {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--gold-dark);
      color: var(--gold-glow);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .sub-filter-btn.active, .sub-filter-btn:hover {
      background: rgba(212, 175, 55, 0.25);
      border-color: var(--gold-pure);
      color: #fff;
    }

    /* Search Bar */
    .search-wrapper { max-width: 600px; margin: 0 auto 20px; padding: 0 15px; }
    .search-input {
      width: 100%;
      padding: 12px 18px;
      border-radius: 25px;
      background: rgba(0, 0, 0, 0.5);
      border: 1.5px solid var(--gold-dark);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      text-align: center;
    }
    .search-input:focus {
      border-color: var(--gold-pure);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
    }

    /* Content Area */
    .content-container { max-width: 940px; margin: 0 auto; padding: 0 15px; }
    .module-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .card-header .badge { background: var(--gold-dark); color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: bold; }
    .card-header h3 { font-size: 1.15rem; color: #fff; }

    .arabic-box {
      font-family: 'Amiri', serif;
      font-size: 1.55rem;
      line-height: 2.1;
      color: var(--gold-glow);
      direction: rtl;
      background: rgba(0, 0, 0, 0.45);
      padding: 16px 20px;
      border-radius: 10px;
      border-right: 4px solid var(--gold-pure);
      margin-bottom: 12px;
      white-space: pre-line;
    }

    .melody-toggle {
      background: rgba(212, 175, 55, 0.1);
      border: 1px dashed var(--gold-pure);
      color: var(--gold-glow);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .melody-toggle:hover { background: var(--gold-pure); color: #051610; }
    .melody-box { display: none; margin-top: 12px; background: rgba(0, 0, 0, 0.45); padding: 14px 16px; border-radius: 10px; border-left: 3px solid var(--gold-glow); }
    .nada-tag { font-size: 0.8rem; color: var(--green-accent); font-weight: bold; margin-bottom: 6px; }
    .lyrics { font-style: italic; line-height: 1.7; color: #f1f2f6; font-size: 0.95rem; white-space: pre-line; }

    .empty-state { text-align: center; padding: 40px 20px; color: #a4b0be; }

    @media(max-width: 768px) {
      .main-tab-btn { min-width: 100%; }
      .hero-farisi { font-size: 2.2rem; }
      .arabic-box { font-size: 1.35rem; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="back-link">← Kembali ke Survei</a>
      <div class="nav-title">بُغْيَةُ الطُّلَّابِ فِي النَّحْوِ</div>
      <div class="user-badge">Santri: <span id="userNamaDisplay">Tamu</span></div>
    </div>
  </header>

  <section class="hero-section">
    <div class="hero-frame">
      <span class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
      <h1 class="hero-farisi" dir="rtl" lang="ar">هِمَّةُ النَّحْوِيَّة</h1>
      <p class="hero-sub">PLATFORM PEMBELAJARAN NAHWU INTERAKTIF</p>
      <p class="hero-dedication">Karya Abi Liwa • Dibina oleh <strong>AHMAD ZAKIN JAISYURROYA</strong></p>
    </div>
  </section>

  <!-- 3 TAB UTAMA -->
  <div class="tab-wrapper-main">
    <button id="tab-lagu" class="main-tab-btn" onclick="selectMainTab('lagu')">
      <span>1. Himpunan Lagu Nahwiyah</span>
      <span class="sub">Haraf, Isim, Fi'il & Bangunan Kalimah</span>
    </button>
    <button id="tab-latihan" class="main-tab-btn" onclick="selectMainTab('latihan')">
      <span>2. Buku Latihan I</span>
      <span class="sub">Membaca Bangunan Kalimah (Arab Gundul)</span>
    </button>
    <button id="tab-nazham" class="main-tab-btn" onclick="selectMainTab('nazham')">
      <span>3. Buku Nazham Jurumiyah</span>
      <span class="sub">Bahasa Indonesia (2015)</span>
    </button>
  </div>

  <!-- Sub-Filter Area (Dinamis untuk Tab Lagu & Tab Latihan) -->
  <div id="subFilterArea" class="sub-filter-wrapper"></div>

  <!-- Kolom Pencarian -->
  <div class="search-wrapper">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari Bab, Kaidah, Wazan, atau Bait..." oninput="handleSearch()">
  </div>

  <!-- Area Konten -->
  <main id="mainContainer" class="content-container"></main>

  <!-- 1. MEMANGGIL DATABASE EKSTERNAL data.js -->
  <script src="data.js"></script>

  <!-- 2. MESIN LOGIKA INTERFACE & NAVIGASI -->
  <script>
    let currentMainTab = 'lagu';
    let currentLaguLevel = 'all';
    let currentLatihanLevel = 'all';

    function selectMainTab(tab) {
      currentMainTab = tab;
      
      document.querySelectorAll('.main-tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('tab-' + tab);
      if (activeBtn) activeBtn.classList.add('active');

      const subArea = document.getElementById('subFilterArea');
      if (subArea) {
        if (tab === 'lagu') {
          subArea.style.display = 'flex';
          subArea.innerHTML = `
            <button id="sub-lvl-all" class="sub-filter-btn ${currentLaguLevel === 'all' ? 'active' : ''}" onclick="setSubLevel('all')">Semua Level</button>
            <button id="sub-lvl-1" class="sub-filter-btn ${currentLaguLevel === 1 ? 'active' : ''}" onclick="setSubLevel(1)">Level 1 (Bab 1-19)</button>
            <button id="sub-lvl-2" class="sub-filter-btn ${currentLaguLevel === 2 ? 'active' : ''}" onclick="setSubLevel(2)">Level 2 (Bab 20-33)</button>
            <button id="sub-lvl-3" class="sub-filter-btn ${currentLaguLevel === 3 ? 'active' : ''}" onclick="setSubLevel(3)">Level 3 (Bab 34-42)</button>
          `;
        } else if (tab === 'latihan') {
          subArea.style.display = 'flex';
          subArea.innerHTML = `
            <button class="sub-filter-btn ${currentLatihanLevel === 'all' ? 'active' : ''}" onclick="setLatihanLevel('all')">Semua Latihan</button>
            <button class="sub-filter-btn ${currentLatihanLevel === 1 ? 'active' : ''}" onclick="setLatihanLevel(1)">Level 1 (Bentuk Dasar)</button>
            <button class="sub-filter-btn ${currentLatihanLevel === 2 ? 'active' : ''}" onclick="setLatihanLevel(2)">Level 2 (Tashrif Dhomir 2A/2B)</button>
          `;
        } else {
          subArea.style.display = 'none';
        }
      }

      document.getElementById('searchInput').value = '';
      renderContent();
    }

    function setSubLevel(lvl) {
      currentLaguLevel = lvl;
      selectMainTab('lagu');
    }

    function setLatihanLevel(lvl) {
      currentLatihanLevel = lvl;
      selectMainTab('latihan');
    }

    function renderContent(filterQuery = '') {
      const container = document.getElementById('mainContainer');
      if (!container) return;
      container.innerHTML = '';
      const query = filterQuery.toLowerCase().trim();

      if (typeof dataLagu === 'undefined' || typeof dataLatihan === 'undefined' || typeof dataNazham === 'undefined') {
        container.innerHTML = `<div class="empty-state">File data.js tidak ditemukan atau sedang mengalami kendala.</div>`;
        return;
      }

      // TAB 1: LAGU NAHWIYAH
      if (currentMainTab === 'lagu') {
        const filtered = dataLagu.filter(item => {
          const matchLevel = currentLaguLevel === 'all' || String(item.level) === String(currentLaguLevel);
          const matchSearch = query === '' || 
            item.judul.toLowerCase().includes(query) || 
            item.arab.includes(query) || 
            item.lirik.toLowerCase().includes(query);
          return matchLevel && matchSearch;
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div class="empty-state">Materi Lagu Nahwiyah tidak ditemukan.</div>`;
          return;
        }

        filtered.forEach(item => {
          const card = document.createElement('article');
          card.className = 'module-card';
          const badgeText = item.bab === "Kaidah" ? "Kaidah" : "Bab " + item.bab;
          card.innerHTML = `
            <div class="card-header"><span class="badge">${badgeText}</span> <h3>${item.judul}</h3></div>
            <div class="arabic-box">${item.arab}</div>
            <button class="melody-toggle" onclick="toggleMelody(this)">🎵 Irama Lagu</button>
            <div class="melody-box">
              <p class="nada-tag">Irama: ${item.irama}</p>
              <div class="lyrics">${item.lirik}</div>
            </div>
          `;
          container.appendChild(card);
        });
      }

      // TAB 2: LATIHAN BACA
      else if (currentMainTab === 'latihan') {
        const filtered = dataLatihan.filter(item => {
          const matchLevel = currentLatihanLevel === 'all' || String(item.level || 1) === String(currentLatihanLevel);
          const matchSearch = query === '' || 
            item.kategori.toLowerCase().includes(query) || 
            item.wazan.includes(query) || 
            item.contoh.includes(query);
          return matchLevel && matchSearch;
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div class="empty-state">Wazan latihan tidak ditemukan.</div>`;
          return;
        }

        filtered.forEach(item => {
          const card = document.createElement('article');
          card.className = 'module-card';
          card.innerHTML = `
            <div class="card-header"><span class="badge">Level ${item.level || 1}</span> <h3>${item.kategori}</h3></div>
            <p style="font-size:0.85rem; color:#f9e295; margin-bottom:8px;">Wazan / Pola: <strong>${item.wazan}</strong></p>
            <div class="arabic-box">${item.contoh}</div>
          `;
          container.appendChild(card);
        });
      }

      // TAB 3: NAZHAM JURUMIYAH
      else if (currentMainTab === 'nazham') {
        const filtered = dataNazham.filter(item => {
          return query === '' || item.bab.toLowerCase().includes(query) || item.syair.toLowerCase().includes(query);
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div class="empty-state">Bait nazham tidak ditemukan.</div>`;
          return;
        }

        filtered.forEach(item => {
          const card = document.createElement('article');
          card.className = 'module-card';
          card.innerHTML = `
            <div class="card-header"><span class="badge">${item.bait}</span> <h3>${item.bab}</h3></div>
            <div class="melody-box" style="display:block; border-left: 3px solid var(--gold-pure);">
              <div class="lyrics">${item.syair}</div>
            </div>
          `;
          container.appendChild(card);
        });
      }
    }

    function toggleMelody(btn) {
      const box = btn.nextElementSibling;
      if (!box) return;
      if (box.style.display === 'block') {
        box.style.display = 'none';
        btn.innerText = '🎵 Irama Lagu';
      } else {
        box.style.display = 'block';
        btn.innerText = '🔼 Sembunyikan Irama';
      }
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value;
      renderContent(q);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const nama = localStorage.getItem('namaSantri');
      if (nama) {
        document.getElementById('userNamaDisplay').innerText = nama;
      }

      let initialTarget = window.location.hash ? window.location.hash.replace('#', '') : localStorage.getItem('targetTabAwal');
      
      if (initialTarget === 'latihan') {
        selectMainTab('latihan');
      } else if (initialTarget === 'nazham') {
        selectMainTab('nazham');
      } else if (initialTarget === 'lvl2') {
        selectMainTab('lagu');
        setSubLevel(2);
      } else if (initialTarget === 'lvl3') {
        selectMainTab('lagu');
        setSubLevel(3);
      } else {
        selectMainTab('lagu');
        setSubLevel('all');
      }
    });
  </script>
</body>
</html>
