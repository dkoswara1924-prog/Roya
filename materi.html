    const dataLatihan = [
      {

        wazan: "فَعَلَ - يَفْعُلُ",
        contoh: "نَصَرَ يَنْصُرُ ، خَلَقَ يَخْلُقُ ، رَزَقَ يَرْزُقُ ، قَتَلَ يَقْتُلُ ، سَلَكَ يَسْلُكُ ، كَتَبَ يَكْتُبُ ، حَكَمَ يَحْكُمُ ، ذَكَرَ يَذْكُرُ"

      {
        kategori: "Fi'il Shahih Tsulatsi Mazid (Af'ala)",
        wazan: "أَفْعَلَ - يُفْعِلُ - إِفْعَالًا",

        bait: "Bait 1 - 10",
        syair: `Ubaid Rabbih Muhammad telah bertutur # Pujian bagi Allah Maha Pengatur

Bagi syapa yang ingin menghafalkannya # Tapi kesulitan menghafal natsarnya

[BAB KALAM]
Sesungguhnya had kalam menurut kami # Lafaz murakkab mufid wadha’ arabi

      {

    // ==========================================
    // LOGIKA RENDER & NAVIGASI
    // ==========================================
    let currentMainTab = 'lagu';
    let currentLaguLevel = 'all';

    function selectMainTab(tab) {
      currentMainTab = tab;
      
      document.querySelectorAll('.main-tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('tab-' + tab);
      if (activeBtn) activeBtn.classList.add('active');

      const subArea = document.getElementById('subFilterArea');
      if (subArea) {
        subArea.style.display = tab === 'lagu' ? 'flex' : 'none';
      }

      document.getElementById('searchInput').value = '';
      renderContent();
    }

    function setSubLevel(lvl) {
      currentLaguLevel = lvl;
      document.querySelectorAll('.sub-filter-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('sub-lvl-' + lvl);
      if (activeBtn) activeBtn.classList.add('active');

      renderContent();
    }

    function renderContent(filterQuery = '') {
      const container = document.getElementById('mainContainer');
      if (!container) return;
      container.innerHTML = '';
      const query = filterQuery.toLowerCase().trim();

      // TAB 1: LAGU NAHWIYAH
      if (currentMainTab === 'lagu') {
        const filtered = dataLagu.filter(item => {
          const matchLevel = currentLaguLevel === 'all' || item.level === currentLaguLevel;
          const matchSearch = query === '' || 
            item.judul.toLowerCase().includes(query) || 
            item.arab.includes(query) || 
            item.lirik.toLowerCase().includes(query);
          return matchLevel && matchSearch;
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div class="empty-state">Materi Lagu Nahwiyah tidak ditemukan.</div>`;
          return;
        }

        filtered.forEach(item => {
          const card = document.createElement('article');
          card.className = 'module-card';
          card.innerHTML = `
            <div class="card-header"><span class="badge">Bab ${item.bab}</span> <h3>${item.judul}</h3></div>
            <div class="arabic-box">${item.arab}</div>
            <button class="melody-toggle" onclick="toggleMelody(this)">🎵 Irama Lagu</button>
            <div class="melody-box">
              <p class="nada-tag">Irama: ${item.irama}</p>
              <div class="lyrics">${item.lirik}</div>
            </div>
          `;
          container.appendChild(card);
        });
      }

      // TAB 2: LATIHAN BACA
      else if (currentMainTab === 'latihan') {
        const filtered = dataLatihan.filter(item => {
          return query === '' || item.kategori.toLowerCase().includes(query) || item.wazan.includes(query) || item.contoh.includes(query);
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div class="empty-state">Wazan latihan tidak ditemukan.</div>`;
          return;
        }

        filtered.forEach(item => {
          const card = document.createElement('article');
          card.className = 'module-card';
          card.innerHTML = `
            <div class="card-header"><span class="badge">Wazan</span> <h3>${item.kategori}</h3></div>
            <p style="font-size:0.85rem; color:#f9e295; margin-bottom:8px;">Pola: <strong>${item.wazan}</strong></p>
            <div class="arabic-box">${item.contoh}</div>
          `;
          container.appendChild(card);
        });
      }

      // TAB 3: NAZHAM JURUMIYAH
      else if (currentMainTab === 'nazham') {
        const filtered = dataNazham.filter(item => {
          return query === '' || item.bab.toLowerCase().includes(query) || item.syair.toLowerCase().includes(query);
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div class="empty-state">Bait nazham tidak ditemukan.</div>`;
          return;
        }

        filtered.forEach(item => {
          const card = document.createElement('article');
          card.className = 'module-card';
          card.innerHTML = `
            <div class="card-header"><span class="badge">${item.bait}</span> <h3>${item.bab}</h3></div>
            <div class="melody-box" style="display:block; border-left: 3px solid var(--gold-pure);">
              <div class="lyrics">${item.syair}</div>
            </div>
          `;
          container.appendChild(card);
        });
      }
    }

    function toggleMelody(btn) {
      const box = btn.nextElementSibling;
      if (!box) return;
      if (box.style.display === 'block') {
        box.style.display = 'none';
        btn.innerText = '🎵 Irama Lagu';
      } else {
        box.style.display = 'block';
        btn.innerText = '🔼 Sembunyikan Irama';
      }
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value;
      renderContent(q);
    }

    // Inisialisasi awal saat DOM siap
    document.addEventListener('DOMContentLoaded', () => {
      const nama = localStorage.getItem('namaSantri');
      if (nama) {
        document.getElementById('userNamaDisplay').innerText = nama;
      }

      let initialTarget = window.location.hash ? window.location.hash.replace('#', '') : localStorage.getItem('targetTabAwal');
      
      if (initialTarget === 'latihan') {
        selectMainTab('latihan');
      } else if (initialTarget === 'nazham') {
        selectMainTab('nazham');
      } else if (initialTarget === 'lvl2') {
        selectMainTab('lagu');
        setSubLevel(2);
      } else if (initialTarget === 'lvl3') {
        selectMainTab('lagu');
        setSubLevel(3);
      } else {
        selectMainTab('lagu');
        setSubLevel(1);
      }
    });
  </script>
